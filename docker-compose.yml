services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rti_dev_only}
      POSTGRES_DB: rti_copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rti -d rti_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rti:${POSTGRES_PASSWORD:-rti_dev_only}@db:5432/rti_copilot
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/srv/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
