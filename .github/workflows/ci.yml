name: CI

# Runs the frontend and backend checks on every pull request and on every push to main.
# Nothing here calls Groq or downloads the embedding model: the tests use the built-in mock
# data and fake embeddings, so no secrets are needed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest, with PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rti
          POSTGRES_PASSWORD: rti
          POSTGRES_DB: rti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rti -d rti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Turns on the tests that run against a real database (they skip without it).
      TEST_DATABASE_URL: postgresql+psycopg://rti:rti@localhost:5432/rti_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The CPU build of PyTorch first, so sentence-transformers does not pull the much
      # larger CUDA build. The tests never load the model.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
