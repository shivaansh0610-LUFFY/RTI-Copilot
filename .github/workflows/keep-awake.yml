# Render's free plan puts the API to sleep after 15 minutes without a request, and waking it
# takes up to a minute. Asking for /health every 10 minutes keeps it awake (one always-on free
# service fits inside Render's 750 free hours a month).
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --max-time 120 --retry 2 https://rti-copilot-api-mp4y.onrender.com/health
